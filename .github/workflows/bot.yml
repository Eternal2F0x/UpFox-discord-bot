name: Run Discord Bot H24

# Bloc de gestion de la concurrence pour stopper l'ancien bot à chaque nouveau push
concurrency:
  group: bot-discord-clan
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les modules Node
        run: npm ci

      - name: Installer PM2 (Gestionnaire de processus)
        run: npm install -g pm2

      - name: Lancer le bot Discord en tâche de fond
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_CHANNEL_NAME: ${{ secrets.TWITCH_CHANNEL_NAME }}
        run: pm2 start index.js --name "mon-bot"

      - name: Afficher les logs de démarrage
        run: pm2 logs "mon-bot" --lines 50 --raw