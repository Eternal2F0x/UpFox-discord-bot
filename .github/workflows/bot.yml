name: Run Discord Bot H24

on:
  push:
    branches: [ main ]
  schedule:
    # GitHub Actions coupe automatiquement les scripts après quelques heures d'exécution continue.
    # Ce paramètre ("cron") indique à GitHub de relancer une machine neuve toutes les 5 heures
    # de manière totalement transparente, assurant un bot H24.
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Installer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Installer les modules Node
      run: npm ci

    - name: Lancer le bot Discord
      env:
        # On injecte de manière sécurisée la clé que tu as configurée dans les GitHub Secrets
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      run: node index.js